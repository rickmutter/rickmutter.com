<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Mutter - Blues Musician & Hall of Fame Inductee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .hero-image {
            max-width: 100%;
            width: 500px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(255, 140, 0, 0.3);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.3rem;
            color: #ff8c00;
            margin-bottom: 20px;
            font-style: italic;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .coming-soon {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #ff8c00;
            font-weight: bold;
        }

        .contact-section {
            margin-top: 50px;
            padding-top: 40px;
            border-top: 2px solid #ff8c00;
        }

        .contact-section p {
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .contact-section a {
            color: #ff8c00;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .contact-section a:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .hero-image {
                width: 100%;
                max-width: 400px;
            }

            .tagline {
                font-size: 1.1rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="stage-photo.png" alt="Rick Mutter" class="hero-image">
        
        <h1>Rick Mutter</h1>
        <p class="tagline">55 Years of Blues & Hammond Organ</p>
        
        <p class="subtitle">
            Heritage Blues Hall of Fame Inductee<br>
            Pacific Northwest & Southwest Blues Legend
        </p>

        <p class="coming-soon">Coming Soon</p>

        <div class="contact-section">
            <p>Get in touch:</p>
            <a href="mailto:rick@rickmutter.com">rick@rickmutter.com</a>
        </div>
    </div>
</body>
</html>
